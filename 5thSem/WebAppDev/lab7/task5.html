<!DOCTYPE html>
<html>
<head>
  <title>Visual Calculator</title>
  <style>
    button {
      width: 44px;
      height: 36px;
      margin: 2px;
      font-size: 16px;
      background-color: #3a3a3a;
      color: white;
      border: 1px solid #555;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #555;
    }
  </style>
</head>
<body>
  <div id="calc" style="width: 220px; border: 2px solid #333; border-radius: 10px; padding: 12px; background:#222; font-family:Arial;">
    <!-- Display screen -->
    <div id="display" style="background: rgb(11, 201, 11); color:#111; font-size: 28px; text-align:right; padding: 10px; border-radius: 6px; margin-bottom:10px; min-height: 44px; word-break:break-all;">0</div>

    <!-- Row 1 -->
    <div>
      <button onclick="press('C')">C</button>
      <button onclick="press('/')">÷</button>
      <button onclick="press('*')">×</button>
      <button onclick="press('-')">-</button>
    </div>

    <!-- Row 2 -->
    <div>
      <button onclick="press('7')">7</button>
      <button onclick="press('8')">8</button>
      <button onclick="press('9')">9</button>
      <button onclick="press('+')">+</button>
    </div>

    <!-- Row 3 -->
    <div>
      <button onclick="press('4')">4</button>
      <button onclick="press('5')">5</button>
      <button onclick="press('6')">6</button>
      <button onclick="press('=')">=</button>
    </div>

    <!-- Row 4 -->
    <div>
      <button onclick="press('1')">1</button>
      <button onclick="press('2')">2</button>
      <button onclick="press('3')">3</button>
      <button onclick="press('.')">.</button>
    </div>

    <!-- Row 5 -->
    <div>
      <button onclick="press('0')" style="width: 192px;">0</button>
    </div>
  </div>

  <script>
    let expr = "";

    function press(key) {
      let display = document.getElementById("display");

      if (key === "C") {
        expr = "";
        display.innerText = "0";
      } else if (key === "=") {
        let result = eval(expr);
        display.innerText = result;
        expr = String(result);
      } else {
        expr += key;
        display.innerText = expr;
      }
    }
  </script>
</body>
</html>
