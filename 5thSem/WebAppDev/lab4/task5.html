<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <title>Document</title>
</head>
<body>
    <div class="container my-4">
    <div class="border p-4 rounded bg-white shadow-sm">
        <h2 class="text-center fw-bold mb-4">Campus Photos</h2>

        <div class="row g-3 mb-5">
            <div class="col-6 col-md-4 text-center">
                <img src="gate.jpeg" class="img-fluid rounded mb-2" alt="Main gate">
                <p class="small text-dark mb-0">Main gate</p>
            </div>
            <div class="col-6 col-md-4 text-center">
                <img src="margala.jpeg" class="img-fluid rounded mb-2" alt="Margalla hills">
                <p class="small text-dark mb-0">Margalla hills</p>
            </div>
            <div class="col-6 col-md-4 text-center">
                <img src="science.jpeg" class="img-fluid rounded mb-2" alt="Science block">
                <p class="small text-dark mb-0">Science block</p>
            </div>
            <div class="col-6 col-md-4 text-center">
                <img src="robotics.webp" class="img-fluid rounded mb-2" alt="Robotics trophy">
                <p class="small text-dark mb-0">Robotics trophy</p>
            </div>
            <div class="col-6 col-md-4 text-center">
                <img src="lake.jpeg" class="img-fluid rounded mb-2" alt="Lake at sunset">
                <p class="small text-dark mb-0">Lake at sunset</p>
            </div>
            <div class="col-6 col-md-4 text-center">
                <img src="hall.jpg" class="img-fluid rounded mb-2" alt="Convocation hall">
                <p class="small text-dark mb-0">Convocation hall</p>
            </div>
        </div>

        <h3 class="fw-bold mb-3">Photo Team</h3>

        <div class="row g-3">
            <div class="col-12 col-md-6">
                <div class="d-flex align-items-center">
                    <img src="p1.webp"rounded-circle me-3" width="70" height="70" alt="Ayesha Khan">
                    <div>
                        <h4 class="h6 fw-bold mb-1 text-dark">Ayesha Khan</h4>
                        <p class="small text-body-secondary mb-0">Team lead, took most of the campus photos.</p>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6">
                <div class="d-flex align-items-center">
                    <img src="p2.webp"img-thumbnail me-3" width="70" height="70" alt="Bilal Ahmed">
                    <div>
                        <h4 class="h6 fw-bold mb-1 text-dark">Bilal Ahmed</h4>
                        <p class="small text-body-secondary mb-0">Edited the pictures for the website.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
