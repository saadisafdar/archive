<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Document</title>
</head>

<body>
    <div class="container mt-4">
        <h2>Society Membership Form</h2>
        <form class="row g-3">
            <div class="col-md-6">
                <label for="fn" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="fn" name="full_name">
            </div>
            <div class="col-md-6">
                <label for="rn" class="form-label">Roll Number</label>
                <input type="text" class="form-control" id="rn" name="roll_number">
            </div>

            <div class="col-md-8">
                <label for="em" class="form-label">Email</label>
                <input type="email" class="form-control" id="em" name="email">
            </div>
            <div class="col-md-4">
                <label for="sec" class="form-label">Section</label>
                <select class="form-select" id="sec" name="section">
                    <option value="">Choose...</option>
                    <option value="A">Section A</option>
                    <option value="B">Section B</option>
                    <option value="C">Section C</option>
                </select>
            </div>

            <div class="col-12">
                <label class="form-label d-block">Year of Study</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="year" id="y1" value="1">
                    <label class="form-check-label" for="y1">Year 1</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="year" id="y2" value="2">
                    <label class="form-check-label" for="y2">Year 2</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="year" id="y3" value="3">
                    <label class="form-check-label" for="y3">Year 3</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="year" id="y4" value="4">
                    <label class="form-check-label" for="y4">Year 4</label>
                </div>
            </div>

            <div class="col-12">
                <label class="form-label">Interests (choose any)</label>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="i1" name="interest" value="web">
                    <label class="form-check-label" for="i1">Web Development</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="i2" name="interest" value="ai">
                    <label class="form-check-label" for="i2">Artificial Intelligence</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="i3" name="interest" value="db">
                    <label class="form-check-label" for="i3">Databases</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="i4" name="interest" value="net">
                    <label class="form-check-label" for="i4">Networking</label>
                </div>
            </div>

            <div class="col-12">
                <label for="reason" class="form-label">Why do you want to join?</label>
                <textarea class="form-control" id="reason" name="reason" rows="3"></textarea>
            </div>

            <div class="col-12">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="terms" name="terms">
                    <label class="form-check-label" for="terms">I have read and agree to the society rules.</label>
                </div>
            </div>

            <div class="col-12">
                <button type="submit" class="btn btn-success">Register</button>
                <button type="reset" class="btn btn-outline-secondary">Clear</button>
            </div>
        </form>
    </div>
</body>

</html>
