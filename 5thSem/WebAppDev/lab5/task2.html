<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Document</title>
</head>

<body>
    <div class="container mt-4">
        <h2>Course Enrollment Form</h2>
        <form class="row g-3">
            <div class="col-md-6">
                <label for="fn" class="form-label">First Name</label>
                <input type="text" class="form-control" id="fn" name="first_name">
            </div>
            <div class="col-md-6">
                <label for="ln" class="form-label">Last Name</label>
                <input type="text" class="form-control" id="ln" name="last_name">
            </div>

            <div class="col-md-8">
                <label for="em" class="form-label">Email</label>
                <input type="email" class="form-control" id="em" name="email">
            </div>
            <div class="col-md-4">
                <label for="yr" class="form-label">Year</label>
                <select class="form-select" id="yr" name="year">
                    <option value="">Choose...</option>
                    <option value="1">Year 1</option>
                    <option value="2">Year 2</option>
                    <option value="3">Year 3</option>
                    <option value="4">Year 4</option>
                </select>
            </div>

            <div class="col-12">
                <label for="crs" class="form-label">Course</label>
                <input type="text" class="form-control" id="crs" name="course" list="crs-list"
                    placeholder="Start typing a course name...">
                <datalist id="crs-list">
                    <option value="Web Application Development">
                    <option value="Database Systems">
                    <option value="Artificial Intelligence">
                    <option value="Computer Networks">
                </datalist>
            </div>

            <div class="col-md-6">
                <label for="ro" class="form-label">Roll Number (read-only)</label>
                <input type="text" class="form-control" id="ro" value="FA24-BCS-????" readonly>
            </div>
            <div class="col-md-6">
                <label for="fee" class="form-label">Fee Code (small input)</label>
                <input type="text" class="form-control form-control-sm" id="fee" name="fee_code"
                    placeholder="e.g. F2026-A">
            </div>

            <div class="col-12">
                <button type="submit" class="btn btn-primary">Submit</button>
                <button type="reset" class="btn btn-outline-secondary">Clear</button>
            </div>
        </form>
    </div>
</body>

</html>
