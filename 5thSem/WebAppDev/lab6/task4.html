<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task 4 - Times Table Visualiser</title>
</head>
<body>

  <h2>Times Table Visualiser</h2>
  <input type="number" id="num" placeholder="Enter a number (e.g. 7)" min="1" max="20" style="width: 200px;">
  <button onclick="generate()">Generate</button>
  
  <div id="grid" style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px;"></div>

  <script>
    function generate() {
      let n = Number(document.getElementById("num").value);
      let grid = document.getElementById("grid");
      grid.innerHTML = ""; // clear previous result

      for (let i = 1; i <= 10; i++) {
        let box = document.createElement("div");
        box.innerText = n + " × " + i + " = " + (n * i);

        box.style.width = "100px";
        box.style.padding = "12px";
        box.style.borderRadius = "8px";
        box.style.textAlign = "center";
        box.style.fontFamily = "Arial, sans-serif";
        box.style.fontWeight = "bold";
        box.style.color = "white";

        if (i % 2 === 0) {
          box.style.background = "#2980b9";
        } else {
          box.style.background = "#16a085";
        }

        grid.appendChild(box);
      }
    }
  </script>

</body>
</html>
