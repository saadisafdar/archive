<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <meta name="description" content="A modern, responsive scientific calculator web app.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- History Panel -->
        <aside class="history-panel">
            <div class="history-header">
                <h3>History</h3>
                <button id="clear-history" title="Clear History">🗑</button>
            </div>
            <ul id="history-list">
                <!-- History items populated via JS -->
            </ul>
        </aside>

        <!-- Calculator UI -->
        <main class="calculator">
            <div class="display-container">
                <div class="display-header">
                    <button id="mode-btn" class="toggle-btn" title="Toggle Degree/Radian">Rad</button>
                </div>
                <div class="expression-container">
                    <div class="expression" id="expression"></div>
                </div>
                <div class="main-display">
                    <div id="result">0</div>
                    <button id="copy-btn" title="Copy Result">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="css-i6dzq1"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    </button>
                </div>
            </div>

            <div class="keypad">
                <!-- Row 1 -->
                <button class="btn sci" data-val="sin(">sin</button>
                <button class="btn sci" data-val="cos(">cos</button>
                <button class="btn sci" data-val="tan(">tan</button>
                <button class="btn sci" data-val="π">π</button>
                <button class="btn sci" data-val="e">e</button>

                <!-- Row 2 -->
                <button class="btn sci" data-val="log(">log</button>
                <button class="btn sci" data-val="ln(">ln</button>
                <button class="btn sci" data-val="sqrt(">√</button>
                <button class="btn sci" data-val="^2">x²</button>
                <button class="btn sci" data-val="^">x^y</button>

                <!-- Row 3 -->
                <button class="btn sci" data-val="1/">1/x</button>
                <button class="btn sci" data-val="abs(">|x|</button>
                <button class="btn sci" data-val="(">(</button>
                <button class="btn sci" data-val=")">)</button>
                <button class="btn action highlight clear" id="clear-btn">C</button>
                
                <!-- Row 4 -->
                <button class="btn num" data-val="7">7</button>
                <button class="btn num" data-val="8">8</button>
                <button class="btn num" data-val="9">9</button>
                <button class="btn action highlight" id="del-btn">⌫</button>
                <button class="btn op highlight" data-val="/">÷</button>

                <!-- Row 5 -->
                <button class="btn num" data-val="4">4</button>
                <button class="btn num" data-val="5">5</button>
                <button class="btn num" data-val="6">6</button>
                <button class="btn op highlight" data-val="*">×</button>
                <button class="btn op highlight" data-val="-">−</button>

                <!-- Row 6 -->
                <button class="btn num" data-val="1">1</button>
                <button class="btn num" data-val="2">2</button>
                <button class="btn num" data-val="3">3</button>
                <button class="btn op highlight" data-val="+">+</button>
                <button class="btn eval highlight-primary" id="eval-btn">=</button>

                <!-- Row 7 -->
                <button class="btn num" data-val="%">%</button>
                <button class="btn num zero" data-val="0">0</button>
                <button class="btn num" data-val=".">.</button>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
