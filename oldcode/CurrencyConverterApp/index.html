<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <meta name="description" content="A simple and modern Currency Converter Web App.">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="converter-container">
        <h1>Currency Converter</h1>
        
        <div class="input-group">
            <label for="amount">Amount</label>
            <input type="number" id="amount" value="1" min="0" step="any" placeholder="Enter amount">
            <span class="error-message" id="amount-error"></span>
        </div>

        <div class="currency-selectors">
            <div class="selector-group">
                <label for="from-currency">From</label>
                <div class="select-wrapper">
                    <select id="from-currency">
                        <!-- Options populated by JS -->
                    </select>
                </div>
            </div>

            <button id="swap-btn" class="swap-btn" aria-label="Swap currencies" title="Swap currencies">⇄</button>

            <div class="selector-group">
                <label for="to-currency">To</label>
                <div class="select-wrapper">
                    <select id="to-currency">
                        <!-- Options populated by JS -->
                    </select>
                </div>
            </div>
        </div>

        <button id="convert-btn" class="convert-btn">Convert</button>

        <div class="result-container">
            <div id="result-display" class="result-display">
                <!-- Result shown here -->
            </div>
            <div id="rate-display" class="rate-display">
                <!-- Single rate shown here -->
            </div>
            <div id="last-updated" class="last-updated">
                <!-- Last updated info shown here -->
            </div>
        </div>
        
        <div id="global-error" class="global-error hidden"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
